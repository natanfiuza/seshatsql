# ==============================================================================
# 🛡️ GitPR - Local Static Linter Configuration
# ==============================================================================
# This file defines quality rules running on the developer's machine.
# GitPR analyzes only the MODIFIED LINES in the 'git diff'.
# 
# Rule Properties:
# - name: Unique rule identifier (no spaces).
# - level: 'error' (blocks commit) or 'warning' (only displays yellow warning).
# - extensions: List of file extensions where the rule applies (e.g., ["php", "js"]).
# - require_paths: (Optional) Limits execution to specific folders (e.g., ["routes/*"]).
# - ignore_paths: (Optional) Ignores specific folders (e.g., ["vendor/*", "tests/*"]).
# - regex: The search regular expression (ALWAYS USE single quotes '').
# - message: The alert text. Supports variables {file_name} and {line_number}.
# - ignore_comments: true (ignores commented code) / false (reads comments).
# ==============================================================================

rules:
  # ---------------------------------------------------------
  # 🚨 CRITICAL ERRORS (Block Commit)
  # ---------------------------------------------------------

  - name: "check-php-debug"
    level: "error"
    extensions: ["php"]
    regex: '\b(dd|dump|var_dump|print_r|die|exit)\s*\('
    message: "🚨 Debug code left behind in file {file_name} (Line {line_number}). Remove before submitting."
    ignore_comments: true

  - name: "check-js-console"
    level: "error"
    extensions: ["js", "ts", "vue", "jsx", "tsx"]
    regex: 'console\.(log|debug|info)\s*\('
    message: "🚨 Use of console.log is not permitted in production. Found in {file_name} (Line {line_number})."
    ignore_comments: true

  - name: "check-localhost"
    level: "error"
    extensions: ["php", "js", "ts", "vue", "env", "yaml", "yml"]
    regex: '(localhost|127\.0\.0\.1)'
    message: "🚨 Local URL or IP (localhost/127.0.0.1) hardcoded in {file_name} (Line {line_number}). Use environment variables."
    ignore_comments: true

  - name: "check-route-verbs"
    level: "error"
    extensions: ["php"]
    require_paths:
      - "routes/*"
    regex: 'Route::[a-zA-Z]+\s*\(\s*[''"](get|get-|busca|buscar|procura|procurar|pesquisa|pesquisar|lista|listar|cria|criar|atualiza|atualizar|deleta|deletar)'
    message: "🚨 Inappropriate URI in {file_name} (Line {line_number}). Avoid using verbs in route URLs. Follow RESTful conventions (e.g., GET /users)."
    ignore_comments: true

  # ---------------------------------------------------------
  # ⚠️ BEST PRACTICE WARNINGS (Do not block Commit)
  # ---------------------------------------------------------

  - name: "warning-docblock-php"
    level: "warning"
    extensions: ["php"]
    regex: '\b(public|protected|private)?\s*function\s+\w+\s*\('
    message: "👀 Reminder: You created/modified the function on line {line_number} of {file_name}. Did you ensure the DocBlock is updated?"
    ignore_comments: true

  - name: "warning-todo-fixme"
    level: "warning"
    extensions: ["php", "js", "ts", "vue", "py"]
    regex: '(?i)(TODO|FIXME):'
    message: "⚠️ Warning: There is a pending TODO or FIXME annotation in {file_name} (Line {line_number})."
    ignore_comments: false # Here we deliberately need to read comments!
